<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong id="userEmail">user@mail.ru</strong> with roles:
        <span id="userRoles">USER</span>
    </span>
    <form action="/logout" method="post" class="mb-0">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-2 bg-white min-vh-100 border-end px-0">
            <div class="nav flex-column nav-pills pt-3" id="userSidebarNav">
                <a class="nav-link active rounded-0" href="/user">User</a>
            </div>
        </div>

        <div class="col-10 p-4">
            <h1 class="mb-4">User information-page</h1>

            <div class="card rounded-0">
                <div class="card-header bg-white">
                    <h5 class="mb-0">About user</h5>
                </div>
                <div class="card-body">
                    <div id="userAlert" class="alert alert-danger d-none" role="alert"></div>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/user.js"></script>
</body>
</html>
