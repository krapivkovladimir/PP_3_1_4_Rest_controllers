<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong th:text="${#httpServletRequest.remoteUser}">admin@mail.ru</strong> with roles: ADMIN USER
    </span>
    <form th:action="@{/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-2 bg-white min-vh-100 border-end px-0">
            <div class="nav flex-column nav-pills pt-3">
                <a class="nav-link active rounded-0" th:href="@{/admin}">Admin</a>
                <a class="nav-link rounded-0" th:href="@{/user}">User</a>
            </div>
        </div>

        <div class="col-10 p-4">
            <h1 class="mb-4">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active"
                            id="users-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#users-table-pane"
                            type="button"
                            role="tab"
                            aria-controls="users-table-pane"
                            aria-selected="true">
                        Users table
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link"
                            id="new-user-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#new-user-pane"
                            type="button"
                            role="tab"
                            aria-controls="new-user-pane"
                            aria-selected="false">
                        New User
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="users-table-pane" role="tabpanel" aria-labelledby="users-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">All users</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.id}"></td>
                                        <td th:text="${user.name}"></td>
                                        <td th:text="${user.lastname}"></td>
                                        <td th:text="${user.age}"></td>
                                        <td th:text="${user.username}"></td>
                                        <td>
                                            <span th:each="role : ${user.roles}"
                                                  th:text="${#strings.replace(role.name, 'ROLE_', '')} + ' '"></span>
                                        </td>
                                        <td>
                                            <button type="button"
                                                    class="btn btn-info btn-sm text-white"
                                                    data-bs-toggle="modal"
                                                    th:data-bs-target="'#editModal' + ${user.id}">
                                                Edit
                                            </button>

                                            <div class="modal fade"
                                                 th:id="'editModal' + ${user.id}"
                                                 tabindex="-1"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-dialog-centered">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/update}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Edit user</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>

                                                            <div class="modal-body">
                                                                <div class="text-center">
                                                                    <input type="hidden" name="id" th:value="${user.id}">

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">ID</label>
                                                                        <input type="text" class="form-control" th:value="${user.id}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-name-' + ${user.id}" class="form-label fw-bold mb-1">First name</label>
                                                                        <input th:id="'edit-name-' + ${user.id}" type="text" name="name" class="form-control" th:value="${user.name}">
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-lastname-' + ${user.id}" class="form-label fw-bold mb-1">Last name</label>
                                                                        <input th:id="'edit-lastname-' + ${user.id}" type="text" name="lastname" class="form-control" th:value="${user.lastname}">
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-age-' + ${user.id}" class="form-label fw-bold mb-1">Age</label>
                                                                        <input th:id="'edit-age-' + ${user.id}" type="number" name="age" class="form-control" th:value="${user.age}">
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-username-' + ${user.id}" class="form-label fw-bold mb-1">Email</label>
                                                                        <input th:id="'edit-username-' + ${user.id}" type="text" name="username" class="form-control" th:value="${user.username}">
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-password-' + ${user.id}" class="form-label fw-bold mb-1">Password</label>
                                                                        <input th:id="'edit-password-' + ${user.id}" type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'edit-roles-' + ${user.id}" class="form-label fw-bold mb-1">Role</label>
                                                                        <select th:id="'edit-roles-' + ${user.id}" name="roles" class="form-select" multiple size="2">
                                                                            <option th:each="role : ${roles}"
                                                                                    th:value="${role.name}"
                                                                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                                                                    th:selected="${user.roles.contains(role)}"></option>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                                <button type="submit" class="btn btn-primary">Edit</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <button type="button"
                                                    class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal"
                                                    th:data-bs-target="'#deleteModal' + ${user.id}">
                                                Delete
                                            </button>

                                            <div class="modal fade"
                                                 th:id="'deleteModal' + ${user.id}"
                                                 tabindex="-1"
                                                 aria-hidden="true">
                                                <div class="modal-dialog modal-dialog-centered">
                                                    <div class="modal-content">
                                                        <form th:action="@{/admin/delete}" method="post">
                                                            <div class="modal-header">
                                                                <h5 class="modal-title">Delete user</h5>
                                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                            </div>

                                                            <div class="modal-body">
                                                                <div class="text-center">
                                                                    <input type="hidden" name="id" th:value="${user.id}">

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">ID</label>
                                                                        <input type="text" class="form-control" th:value="${user.id}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">First name</label>
                                                                        <input type="text" class="form-control" th:value="${user.name}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">Last name</label>
                                                                        <input type="text" class="form-control" th:value="${user.lastname}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">Age</label>
                                                                        <input type="text" class="form-control" th:value="${user.age}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label class="form-label fw-bold mb-1">Email</label>
                                                                        <input type="text" class="form-control" th:value="${user.username}" disabled>
                                                                    </div>

                                                                    <div class="mb-3">
                                                                        <label th:for="'delete-roles-' + ${user.id}" class="form-label fw-bold mb-1">Role</label>
                                                                        <select th:id="'delete-roles-' + ${user.id}" class="form-select" multiple size="2" disabled>
                                                                            <option th:each="role : ${roles}"
                                                                                    th:value="${role.name}"
                                                                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}"
                                                                                    th:selected="${user.roles.contains(role)}"></option>
                                                                        </select>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <div class="modal-footer">
                                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                                <button type="submit" class="btn btn-danger">Delete</button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="new-user-pane" role="tabpanel" aria-labelledby="new-user-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Add new user</h5>
                        </div>
                        <div class="card-body">
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-7 col-lg-4">
                                    <form th:action="@{/admin/add}" method="post" class="text-center">
                                        <div class="mb-3">
                                            <label for="name" class="form-label fw-bold mb-1">First name</label>
                                            <input id="name" type="text" name="name" class="form-control">
                                        </div>

                                        <div class="mb-3">
                                            <label for="lastname" class="form-label fw-bold mb-1">Last name</label>
                                            <input id="lastname" type="text" name="lastname" class="form-control">
                                        </div>

                                        <div class="mb-3">
                                            <label for="age" class="form-label fw-bold mb-1">Age</label>
                                            <input id="age" type="number" name="age" class="form-control">
                                        </div>

                                        <div class="mb-3">
                                            <label for="username" class="form-label fw-bold mb-1">Email</label>
                                            <input id="username" type="text" name="username" class="form-control">
                                        </div>

                                        <div class="mb-3">
                                            <label for="password" class="form-label fw-bold mb-1">Password</label>
                                            <input id="password" type="password" name="password" class="form-control">
                                        </div>

                                        <div class="mb-3">
                                            <label for="roles" class="form-label fw-bold mb-1">Role</label>
                                            <select id="roles" name="roles" class="form-select" multiple size="2">
                                                <option th:each="role : ${roles}"
                                                        th:value="${role.name}"
                                                        th:text="${#strings.replace(role.name, 'ROLE_', '')}"></option>
                                            </select>
                                        </div>

                                        <button type="submit" class="btn btn-success px-4">Add new user</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
