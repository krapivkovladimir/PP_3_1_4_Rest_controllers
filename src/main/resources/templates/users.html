<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-text text-white">
        <strong id="currentUserEmail">admin@mail.ru</strong> with roles:
        <span id="currentUserRoles">ADMIN USER</span>
    </span>
    <form action="/logout" method="post" class="mb-0">
        <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <div class="col-2 bg-white min-vh-100 border-end px-0">
            <div class="nav flex-column nav-pills pt-3">
                <a class="nav-link active rounded-0" href="/admin">Admin</a>
                <a class="nav-link rounded-0" href="/user">User</a>
            </div>
        </div>

        <div class="col-10 p-4">
            <h1 class="mb-4">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active"
                            id="users-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#users-table-pane"
                            type="button"
                            role="tab"
                            aria-controls="users-table-pane"
                            aria-selected="true">
                        Users table
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link"
                            id="new-user-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#new-user-pane"
                            type="button"
                            role="tab"
                            aria-controls="new-user-pane"
                            aria-selected="false">
                        New User
                    </button>
                </li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="users-table-pane" role="tabpanel" aria-labelledby="users-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">All users</h5>
                        </div>
                        <div class="card-body">
                            <div id="adminAlert" class="alert alert-danger d-none" role="alert"></div>
                            <div class="table-responsive">
                                <table class="table table-striped align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Age</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody id="usersTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="new-user-pane" role="tabpanel" aria-labelledby="new-user-tab">
                    <div class="card rounded-0 border-top-0">
                        <div class="card-header bg-white">
                            <h5 class="mb-0">Add new user</h5>
                        </div>
                        <div class="card-body">
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-7 col-lg-4">
                                    <form id="newUserForm" class="text-center">
                                        <div class="mb-3">
                                            <label for="newName" class="form-label fw-bold mb-1">First name</label>
                                            <input id="newName" type="text" name="name" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="newLastname" class="form-label fw-bold mb-1">Last name</label>
                                            <input id="newLastname" type="text" name="lastname" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="newAge" class="form-label fw-bold mb-1">Age</label>
                                            <input id="newAge" type="number" name="age" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="newUsername" class="form-label fw-bold mb-1">Email</label>
                                            <input id="newUsername" type="text" name="username" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="newPassword" class="form-label fw-bold mb-1">Password</label>
                                            <input id="newPassword" type="password" name="password" class="form-control" required>
                                        </div>

                                        <div class="mb-3">
                                            <label for="newRoles" class="form-label fw-bold mb-1">Role</label>
                                            <select id="newRoles" name="roles" class="form-select" multiple size="2" required></select>
                                        </div>

                                        <button type="submit" class="btn btn-success px-4">Add new user</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="editUserForm">
                <div class="modal-header">
                    <h5 class="modal-title">Edit user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="text-center">
                        <input type="hidden" id="editId">

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">ID</label>
                            <input type="text" id="editIdView" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label for="editName" class="form-label fw-bold mb-1">First name</label>
                            <input id="editName" type="text" name="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editLastname" class="form-label fw-bold mb-1">Last name</label>
                            <input id="editLastname" type="text" name="lastname" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editAge" class="form-label fw-bold mb-1">Age</label>
                            <input id="editAge" type="number" name="age" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editUsername" class="form-label fw-bold mb-1">Email</label>
                            <input id="editUsername" type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="editPassword" class="form-label fw-bold mb-1">Password</label>
                            <input id="editPassword" type="password" name="password" class="form-control"
                                   placeholder="Leave blank to keep current password">
                        </div>

                        <div class="mb-3">
                            <label for="editRoles" class="form-label fw-bold mb-1">Role</label>
                            <select id="editRoles" name="roles" class="form-select" multiple size="2" required></select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="deleteUserForm">
                <div class="modal-header">
                    <h5 class="modal-title">Delete user</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="text-center">
                        <input type="hidden" id="deleteId">

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">ID</label>
                            <input type="text" id="deleteIdView" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">First name</label>
                            <input type="text" id="deleteName" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Last name</label>
                            <input type="text" id="deleteLastname" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Age</label>
                            <input type="text" id="deleteAge" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold mb-1">Email</label>
                            <input type="text" id="deleteUsername" class="form-control" disabled>
                        </div>

                        <div class="mb-3">
                            <label for="deleteRoles" class="form-label fw-bold mb-1">Role</label>
                            <select id="deleteRoles" class="form-select" multiple size="2" disabled></select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
